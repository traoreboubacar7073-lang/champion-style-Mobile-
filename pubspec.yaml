name: champions_style
description: "Champions Style — Application de gestion pour l'atelier de couture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de données locale (tout reste sur le téléphone, aucun serveur requis)
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Polices Google (Cormorant Garamond + Inter, comme sur les autres versions)
  google_fonts: ^6.1.0

  # Remarque : image_picker (prise de photo produit) sera ajouté quand on
  # construira le module Produits & Services — retiré pour l'instant, un
  # bug connu de l'outil "lint" d'Android plante dessus avec les toutes
  # dernières versions d'AGP.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_icon.png
