name: champions_style
description: "Champions Style — Application de gestion pour l'atelier de couture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de données locale (tout reste sur le téléphone, aucun serveur requis)
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Polices Google (Cormorant Garamond + Inter, comme sur les autres versions)
  google_fonts: ^6.1.0

  # Prise de photo (produits, première commande d'un client) — réactivé
  # maintenant que la vérification "lint" est désactivée pour la
  # compilation (voir android/app/build.gradle), ce qui évitait le
  # plantage rencontré précédemment.
  image_picker: ^1.0.4

  # Génération de PDF (factures, reçus de paiement) + partage natif du
  # téléphone (WhatsApp, email, Bluetooth...) et impression directe.
  pdf: ^3.10.7
  printing: ^5.12.0

  # Ouvre WhatsApp directement sur la conversation d'un client, avec un
  # message déjà rédigé — utilisé pour prévenir qu'une commande est prête.
  url_launcher: ^6.2.5

  # Partage de fichiers (sauvegarde JSON) et sélection de fichier pour
  # restaurer une sauvegarde — paquets stables et très largement utilisés.
  share_plus: ^7.2.2
  file_picker: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_icon.png
