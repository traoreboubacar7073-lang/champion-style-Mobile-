plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    // Le plugin Gradle de Flutter doit être appliqué en dernier.
    id("dev.flutter.flutter-gradle-plugin")
}

android {
    namespace = "com.championsstyle.champions_style"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Identifiant unique de l'application — à ne pas changer une fois
        // publiée quelque part, sinon Android la considère comme une
        // application différente.
        applicationId = "com.championsstyle.champions_style"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signature avec la clé de débogage pour l'instant, afin que
            // "flutter build apk --release" fonctionne directement sans
            // configuration supplémentaire. Une vraie clé de signature
            // pourra être ajoutée plus tard, avant une éventuelle
            // publication sur le Play Store.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

