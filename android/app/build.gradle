plugins {
    id("com.android.application")
    // Le plugin Gradle de Flutter doit être appliqué après le plugin Android.
    // Depuis Android Gradle Plugin 9, Kotlin est pris en charge nativement
    // (plus besoin d'appliquer un plugin Kotlin séparé).
    id("dev.flutter.flutter-gradle-plugin")
}

android {
    namespace = "com.championsstyle.champions_style"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        // Identifiant unique de l'application — à ne pas changer une fois
        // publiée quelque part, sinon Android la considère comme une
        // application différente.
        applicationId = "com.championsstyle.champions_style"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signature avec la clé de débogage pour l'instant, afin que
            // "flutter build apk --release" fonctionne directement sans
            // configuration supplémentaire. Une vraie clé de signature
            // pourra être ajoutée plus tard, avant une éventuelle
            // publication sur le Play Store.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
