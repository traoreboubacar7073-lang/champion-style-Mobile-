plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.championsstyle.champions_style"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Identifiant unique de l'application — à ne pas changer une fois
        // publiée quelque part, sinon Android la considère comme une
        // application différente.
        applicationId = "com.championsstyle.champions_style"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signature avec la clé de débogage pour l'instant, afin que
            // "flutter build apk --release" fonctionne directement sans
            // configuration supplémentaire. Une vraie clé de signature
            // pourra être ajoutée plus tard, avant une éventuelle
            // publication sur le Play Store.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
